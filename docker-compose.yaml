services:
  escola-db:
    container_name: escola-db
    build:
      context: ./db
    environment:
      POSTGRES_DB: escola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: trust
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escola"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - rede-projeto

  escola-node:
    build: ./geracao_dados
    container_name: escola-node
    depends_on:
      escola-db:
        condition: service_healthy
    environment:
      DB_HOST: escola-db
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: escola
      DB_PORT: 5432
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - rede-projeto

  escola-api:
    build: ./api
    container_name: escola-api
    ports:
      - "8000:8000"
    depends_on:
      escola-db:
        condition: service_healthy
    environment:
      DB_HOST: escola-db
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: escola
      DB_PORT: 5432
      DATABASE_URL: "postgresql://postgres:admin@escola-db:5432/escola"
    # volumes:
    #   - ./api:/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - rede-projeto
  
  escola-frontend:
    build: ./client
    container_name: escola-frontend
    ports:
      - "3000:3000"
    depends_on:
      escola-api:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - rede-projeto

volumes:
  postgres_data:
networks:
  rede-projeto:
    driver: bridge
