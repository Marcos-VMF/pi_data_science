receivers:
  filelog/nginx_access:
    include: [ "/var/log/nginx/access.log" ] # Path to Nginx access logs inside the container
    start_at: beginning # Start reading from the beginning of the file
    operators:
      - type: json_parser # Use the JSON parser for access logs
        timestamp:
          parse_from: attributes.time_local
          layout: '%d/%b/%Y:%H:%M:%S %z' # Match the time_local format in your Nginx config
      - type: remove # Remove the original time_local string attribute after parsing
        field: attributes.time_local
      - type: add # Add a static attribute for filtering in Loki
        attributes:
          log_type: nginx_access

  filelog/nginx_error:
    include: [ "/var/log/nginx/error.log" ] # Path to Nginx error logs inside the container
    start_at: beginning # Start reading from the beginning of the file
    operators:
      # You might need operators here to parse the error log format if it's structured
      # For basic text logs, no specific parsing might be needed beyond the default
      - type: add # Add a static attribute for filtering in Loki
        attributes:
          log_type: nginx_error
      # Example: if your error logs have a timestamp at the beginning
      # - type: regex_parser
      #   regex: '^(?P<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)$'
      #   timestamp:
      #     parse_from: attributes.time
      #     layout: '%Y/%m/%d %H:%M:%S'
      #   severity:
      #     parse_from: attributes.level


exporters:
  loki:
    endpoint: http://loki:3100/api/v1/push # Default Loki endpoint within the LGTM container
    # You might want to configure labels for Loki here based on your needs
    # sending_queue:
    #   enabled: true
    #   num_consumers: 4
    #   queue_size: 1000

service:
  pipelines:
    logs/access:
      receivers: [filelog/nginx_access]
      processors: [] # Add processors here if needed (e.g., batch, attributes)
      exporters: [loki]
    logs/error:
      receivers: [filelog/nginx_error]
      processors: [] # Add processors here if needed
      exporters: [loki]